<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
<div class="min-h-screen flex items-center justify-center p-6">
    <div class="bg-white shadow-lg rounded-2xl max-w-md w-full p-8 text-center">
        <!-- Header -->
        <h1 class="text-3xl font-semibold text-gray-800 mb-2">Checkout</h1>
        <p class="text-gray-500 mb-6">Select your preferred payment method</p>

        <div class="space-y-4">
            <form th:action="@{|/booking/checkout/${bookingId}/pay-online|}" method="post">
                <button type="submit"
                        class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-3 rounded-xl shadow-sm transition duration-200">
                    💳 Pay Online
                </button>
            </form>

            <form th:action="@{|/booking/checkout/${bookingId}/pay-cash|}" method="post">
                <button type="submit"
                        class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-3 rounded-xl shadow-sm transition duration-200">
                    💵 Pay Cash
                </button>
            </form>
        </div>

        <div class="mt-8 text-sm text-gray-500">
            <p>Your booking ID: <span class="font-medium text-gray-800" th:text="${bookingId}">#12345</span></p>
            <a th:href="@{/}" class="inline-block mt-3 text-emerald-600 hover:text-emerald-700 font-medium">
                ← Back to Home
            </a>
        </div>
    </div>
</div>
</body>
</html>
