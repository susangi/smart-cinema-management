<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8" />
    <title th:replace="${title}">Smart Cinema</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
</head>
<body class="bg-slate-50 text-slate-900">
<header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <a th:href="@{/}" class="text-xl font-semibold text-indigo-700">Smart Cinema</a>
        <nav class="text-sm">
            <a th:href="@{/}" class="px-3 py-2 rounded hover:bg-slate-100">Home</a>
            <a th:href="@{/movies}" class="px-3 py-2 rounded hover:bg-slate-100">Movies</a>
        </nav>
    </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-8">
    <div th:insert="${content}"></div>
</main>

<footer class="mt-16 border-t border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-6 text-sm text-slate-500">
        © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> Smart Cinema
    </div>
</footer>
</body>
</html>
