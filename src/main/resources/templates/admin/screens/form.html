<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${screenResp!=null} ? 'Edit Screen' : 'New Screen'">Screen Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class'}</script>
</head>
<body>
<div th:replace="~{admin/layout :: shell(~{::section})}">
    <section>
        <div class="flex items-start justify-between mb-6">
            <div>
                <nav class="text-sm text-slate-500 mb-1">
                    <a th:href="@{/admin}" class="hover:text-slate-700">Admin</a> /
                    <a th:href="@{/admin/screens}" class="hover:text-slate-700">Screens</a> /
                    <span class="text-slate-700" th:text="${screenResp!=null ? 'Edit' : 'New'}">New</span>
                </nav>
                <h1 class="text-2xl font-semibold text-slate-900" th:text="${screenResp!=null ? 'Edit Screen' : 'Create Screen'}">Create Screen</h1>
            </div>
            <a th:href="@{/admin/screens}" class="rounded-md border border-slate-300 bg-white px-4 py-2.5 hover:bg-slate-50">Back</a>
        </div>

        <form th:action="${screenResp==null} ? @{/admin/screens} : @{'/admin/screens/' + ${screenResp.id}}"
              method="post" th:object="${screen}"
              class="rounded-xl border border-slate-200 bg-white p-6 space-y-6 shadow-sm">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Name *</label>
                    <input th:field="*{name}" required class="w-full rounded-md border border-slate-300 px-3 py-2.5"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Code *</label>
                    <input th:field="*{code}" required class="w-full rounded-md border border-slate-300 px-3 py-2.5"/>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Type</label>
                    <select th:field="*{type}" class="w-full rounded-md border border-slate-300 px-3 py-2.5">
                        <option value="2D">2D</option>
                        <option value="3D">3D</option>
                        <option value="IMAX">IMAX</option>
                        <option value="4DX">4DX</option>
                    </select>
                </div>

                <!-- Capacity (BIND IT, so it posts) -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Capacity</label>

                    <input th:field="*{capacity}" type="number" step="1" min="0"
                           class="w-full rounded-md border border-slate-300 px-3 py-2.5" />
                </div>








                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                    <textarea th:field="*{description}" rows="3"
                              class="w-full rounded-md border border-slate-300 px-3 py-2.5"></textarea>
                </div>
            </div>



            <div class="flex items-center justify-between">
                <label class="inline-flex items-center gap-2 text-slate-700 text-sm">
<!--                    <input type="hidden" name="active" value="false"/>-->
                    <input th:field="*{active}" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-indigo-600">
                    Active
                </label>
                <div class="flex gap-2">
                    <button class="rounded-md bg-indigo-600 text-white px-5 py-2.5 hover:bg-indigo-700">
                        <span th:text="${screenResp!=null ? 'Update Screen' : 'Save Screen'}">Save</span>
                    </button>
                </div>
            </div>
        </form>
    </section>
</div>
</body>
</html>
