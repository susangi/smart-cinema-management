<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle} ?: 'Admin | Smart Cinema'">
      Admin | Smart Cinema
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body class="bg-slate-900 text-slate-100">
    <div th:fragment="shell(content)" class="min-h-screen flex flex-col">
      <header
        class="sticky top-0 z-50 bg-slate-900/90 border-b border-slate-800 backdrop-blur-md"
      >
        <div
          class="max-w-7xl mx-auto flex items-center justify-between h-16 px-4"
        >
          <a
            href="/admin/dashboard"
            class="flex items-center gap-2 font-semibold text-white"
          >
            <svg
              class="w-6 h-6 text-blue-400"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M4 5a2 2 0 0 1 2-2h4v6H4V5zm6 6H4v6a2 2 0 0 0 2 2h4v-8zm2-8h6a2 2 0 0 1 2 2v4h-8V3zm8 8h-8v8h6a2 2 0 0 0 2-2v-6z"
              />
            </svg>
            Smart Cinema
          </a>

          <nav class="hidden md:flex gap-4 text-sm">
            <a
              href="/admin/dashboard"
              class="px-3 py-2 rounded-md font-medium transition"
              th:classappend="${#strings.contains(path, '/admin/dashboard')} ?
             'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
            >
              Dashboard
            </a>

            <a
              href="/admin/movies"
              class="px-3 py-2 rounded-md font-medium transition"
              th:classappend="${#strings.contains(path, '/admin/movies')} ?
             'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
            >
              Movies
            </a>

            <a
              href="/admin/screens"
              class="px-3 py-2 rounded-md font-medium transition"
              th:classappend="${#strings.contains(path, '/admin/screens')} ?
             'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
            >
              Screens
            </a>


            <a
              href="/admin/pricing"
              class="px-3 py-2 rounded-md font-medium transition"
              th:classappend="${#strings.contains(path, '/admin/pricing')} ?
             'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
            >
              Pricing
            </a>

              <a
                      href="/admin/schedules"
                      class="px-3 py-2 rounded-md font-medium transition"
                      th:classappend="${#strings.contains(path, '/admin/schedules')} ?
             'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
              >
                  Schedules
              </a>

            <a
              href="/admin/reports/revenue"
              class="px-3 py-2 rounded-md font-medium transition"
              th:classappend="${#strings.contains(path, '/admin/reports')} ?
             'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'"
            >
              Revenue Report
            </a>
          </nav>

          <div class="flex items-center gap-4">
            <span
              class="hidden sm:inline text-sm text-slate-400"
              th:text="${adminName} ?: 'Admin User'"
              >Admin User</span
            >
            <a
              href="/perform_logout"
              class="text-sm text-slate-400 hover:text-white border border-slate-700 rounded-lg px-3 py-1"
            >
              Logout
            </a>
          </div>
        </div>
      </header>

      <div class="fixed top-5 right-5 space-y-3 w-full max-w-sm z-50">
        <div
          th:if="${success} or ${param.success}"
          class="alert flex items-center bg-green-500 text-white font-semibold tracking-wide p-4 rounded-md shadow-lg shadow-green-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 fill-white mr-3"
            viewBox="0 0 512 512"
          >
            <ellipse cx="256" cy="256" fill="#fff" rx="256" ry="255.832" />
            <path
              class="fill-green-600"
              d="m235.472 392.08-121.04-94.296 34.416-44.168 74.328 57.904 122.672-177.016 46.032 31.888z"
            />
          </svg>
          <span
            class="text-[15px]"
            th:text="${success} ?: ${param.success}"
          ></span>
          <button
            type="button"
            onclick="this.parentElement.style.display='none'"
          >
            &times;
          </button>
        </div>

        <div
          th:if="${warn} or ${param.warn}"
          class="alert flex items-center bg-yellow-500 text-white font-semibold tracking-wide p-4 rounded-md shadow-lg shadow-yellow-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 fill-white mr-3"
            viewBox="0 0 128 128"
          >
            <path
              d="M56.463 14.337 6.9 106.644C4.1 111.861 8.173 118 14.437 118h99.126c6.264 0 10.338-6.139 7.537-11.356L71.537 14.337c-3.106-5.783-11.968-5.783-15.074 0z"
            />
            <g class="fill-yellow-600">
              <path
                d="M64 31.726a5.418 5.418 0 0 0-5.5 5.45l1.017 44.289A4.422 4.422 0 0 0 64 85.726a4.422 4.422 0 0 0 4.482-4.261L69.5 37.176a5.418 5.418 0 0 0-5.5-5.45z"
              />
              <circle cx="64" cy="100.222" r="6" />
            </g>
          </svg>
          <span class="text-[15px]" th:text="${warn} ?: ${param.warn}"></span>
          <button
            type="button"
            onclick="this.parentElement.style.display='none'"
          >
            &times;
          </button>
        </div>

        <div
          th:if="${error} or ${param.error}"
          class="alert flex items-center bg-red-500 text-white font-semibold tracking-wide p-4 rounded-md shadow-lg shadow-red-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 fill-white mr-3"
            viewBox="0 0 32 32"
          >
            <path
              d="M16 1a15 15 0 1 0 15 15A15 15 0 0 0 16 1zm6.36 20L21 22.36l-5-4.95-4.95 4.95L9.64 21l4.95-5-4.95-4.95 1.41-1.41L16 14.59l5-4.95 1.41 1.41-5 4.95z"
            />
          </svg>
          <span class="text-[15px]" th:text="${error} ?: ${param.error}"></span>
          <button
            type="button"
            onclick="this.parentElement.style.display='none'"
          >
            &times;
          </button>
        </div>

        <div
          th:if="${info} or ${param.info}"
          class="alert flex items-center bg-blue-500 text-white font-semibold tracking-wide p-4 rounded-md shadow-lg shadow-blue-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 fill-white mr-3"
            viewBox="0 0 23.625 23.625"
          >
            <path
              d="M11.812 0C5.289 0 0 5.289 0 11.812s5.289 11.813 11.812 11.813 11.813-5.29 11.813-11.813S18.335 0 11.812 0zm2.459 18.307c-.608.24-1.092.422-1.455.548a3.838 3.838 0 0 1-1.262.189c-.736 0-1.309-.18-1.717-.539s-.611-.814-.611-1.367c0-.215.015-.435.045-.659a8.23 8.23 0 0 1 .147-.759l.761-2.688c.067-.258.125-.503.171-.731.046-.23.068-.441.068-.633 0-.342-.071-.582-.212-.717-.143-.135-.412-.201-.813-.201-.196 0-.398.029-.605.09-.205.063-.383.12-.529.176l.201-.828c.498-.203.975-.377 1.43-.521a4.225 4.225 0 0 1 1.29-.218c.731 0 1.295.178 1.692.53.395.353.594.812.594 1.376 0 .117-.014.323-.041.617a4.129 4.129 0 0 1-.152.811l-.757 2.68a7.582 7.582 0 0 0-.167.736 3.892 3.892 0 0 0-.073.626c0 .356.079.599.239.728.158.129.435.194.827.194.185 0 .392-.033.626-.097.232-.064.4-.121.506-.17l-.203.827zm-.134-10.878a1.807 1.807 0 0 1-1.275.492c-.496 0-.924-.164-1.28-.492a1.57 1.57 0 0 1-.533-1.193c0-.465.18-.865.533-1.196a1.812 1.812 0 0 1 1.28-.497c.497 0 .923.165 1.275.497.353.331.53.731.53 1.196 0 .467-.177.865-.53 1.193z"
            />
          </svg>
          <span class="text-[15px]" th:text="${info} ?: ${param.info}"></span>
          <button
            type="button"
            onclick="this.parentElement.style.display='none'"
          >
            &times;
          </button>
        </div>
      </div>

      <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-8">
        <section th:insert="${content}">Content</section>
      </main>

      <footer
        class="border-t border-slate-800 py-6 text-center text-xs text-slate-500"
      >
        ©
        <span th:text="${#dates.format(#dates.createNow(),'yyyy')}">2025</span>
        Smart Cinema
      </footer>
    </div>
  </body>
</html>
