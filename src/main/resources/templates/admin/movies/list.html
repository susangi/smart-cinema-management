<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movies • Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
</head>
<body>
<div th:replace="~{admin/layout :: shell(~{::section})}">
    <section>
        <!-- breadcrumb + header -->
        <div class="flex items-start justify-between mb-6">
            <div>
                <nav class="text-sm text-slate-500 mb-1">
                    <a th:href="@{/admin}" class="hover:text-slate-700">Admin</a> /
                    <span class="text-slate-700">Movies</span>
                </nav>
                <h1 class="text-2xl font-semibold text-slate-900">Movies</h1>
                <p class="text-sm text-slate-500">Manage your catalog, posters, and visibility.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <!-- TMDB Import button -->
                <a th:href="@{/admin/movies/tmdb}"
                   class="inline-flex items-center rounded-md border border-slate-300 bg-white px-4 py-2.5 text-slate-700 hover:bg-slate-50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                              d="M3 10h4l3 10 4-18 3 8h4"/>
                    </svg>
                    Import from TMDB
                </a>

                <!-- existing new movie button -->
                <a th:href="@{/admin/movies/new}"
                   class="inline-flex items-center rounded-md bg-indigo-600 px-4 py-2.5 text-white hover:bg-indigo-700 shadow-sm">
                    + New Movie
                </a>
            </div>
        </div>

        <!-- search -->
        <form th:action="@{/admin/movies}" method="get" class="mb-5">
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" name="q" th:value="${q}" placeholder="Search by title..."
                       class="flex-1 rounded-md border border-slate-300 bg-white px-3 py-2.5 text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
                <div class="flex gap-2">
                    <button class="rounded-md border border-slate-300 bg-white px-4 py-2.5 text-slate-700 hover:bg-slate-50">Search</button>
                    <a th:href="@{/admin/movies}" class="rounded-md border border-slate-300 bg-white px-4 py-2.5 text-slate-700 hover:bg-slate-50">Reset</a>
                </div>
            </div>
        </form>

        <!-- table -->
        <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <!-- column sizing -->
                    <colgroup>
                        <col style="width: 84px" />            <!-- Poster -->
                        <col />                                <!-- Title & Status (flex) -->
                        <col style="width: 22%" />             <!-- Genre (a bit wider) -->
                        <col style="width: 110px" />           <!-- Duration -->
                        <col style="width: 120px" />           <!-- Release -->
                        <col style="width: 90px" />            <!-- Rating -->
                        <col style="width: 160px" />           <!-- Actions -->
                    </colgroup>

                    <thead class="bg-slate-50 sticky top-0 z-10">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Poster</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Title & Status</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Genre</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Duration</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Release</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Rating</th>
                        <th class="px-4 py-3 text-right text-xs font-semibold text-slate-600 uppercase">Actions</th>
                    </tr>
                    </thead>

                    <tbody class="divide-y divide-slate-100">
                    <tr th:each="m : ${page.content}"
                        class="hover:bg-indigo-50/40 transition-colors even:bg-slate-50/40">
                        <!-- Poster -->
                        <td class="px-4 py-3">
                            <img th:if="${m.posterPath != null}"
                                 th:src="@{'/uploads/posters/' + ${m.posterPath}}"
                                 class="h-16 w-12 rounded object-cover border border-slate-200" alt="Poster"/>
                            <div th:if="${m.posterPath == null}"
                                 class="h-16 w-12 bg-slate-100 rounded grid place-items-center text-slate-500 text-xs">N/A</div>
                        </td>

                        <!-- Title & Status (flexible column) -->
                        <td class="px-4 py-3 align-top">
                            <div class="max-w-[44ch] md:max-w-[52ch]">
                                <div class="font-semibold text-slate-900 truncate" th:text="${m.title}">Title</div>
                                <div class="text-xs text-slate-500 line-clamp-2" th:text="${m.description}">
                                    Description…
                                </div>
                            </div>
                            <span th:if="${m.active}"
                                  class="inline-flex mt-1 items-center rounded-full bg-green-50 px-2 py-0.5 text-xs font-medium text-green-700 border border-green-200">
            Active
          </span>
                            <span th:if="${!m.active}"
                                  class="inline-flex mt-1 items-center rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-600 border border-slate-200">
            Inactive
          </span>
                        </td>

                        <!-- Genre -->
                        <td class="px-4 py-3 text-slate-700">
                            <div class="max-w-[28ch] line-clamp-3" th:text="${m.genre}">Drama</div>
                        </td>

                        <!-- Duration -->
                        <td class="px-4 py-3 text-slate-700 whitespace-nowrap" th:text="${m.durationMinutes} + ' min'">120 min</td>

                        <!-- Release -->
                        <td class="px-4 py-3 text-slate-700 whitespace-nowrap"
                            th:text="${#temporals.format(m.releaseDate,'yyyy-MM-dd')}">2025-01-01</td>

                        <!-- Rating -->
                        <td class="px-4 py-3">
          <span class="inline-flex items-center rounded bg-amber-50 px-2 py-0.5 text-amber-700 border border-amber-200 text-xs"
                th:text="${m.rating != null ? #numbers.formatDecimal(m.rating,1,'COMMA',2,'POINT') : '0.00'}">
            7.90
          </span>
                        </td>

                        <!-- Actions -->
                        <td class="px-4 py-3">
                            <div class="flex justify-end gap-2">
                                <a th:href="@{'/admin/movies/' + ${m.id} + '/edit'}"
                                   class="inline-flex items-center rounded-md border border-slate-300 bg-white px-3 py-1.5 text-slate-700 hover:bg-slate-50">
                                    Edit
                                </a>
                                <form th:action="@{'/admin/movies/' + ${m.id} + '/delete'}" method="post"
                                      onsubmit="return confirm('Delete this movie?');">
                                    <button type="submit"
                                            class="inline-flex items-center rounded-md bg-red-50 text-red-700 border border-red-200 px-3 py-1.5 hover:bg-red-100">
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(page.content)}">
                        <td colspan="7" class="px-4 py-10 text-center text-slate-500">No movies found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>


        <!-- pagination -->
        <div th:if="${page.totalPages > 1}" class="mt-6 flex items-center justify-between text-slate-600 text-sm">
            <div>Page <span th:text="${page.number + 1}">1</span> of <span th:text="${page.totalPages}">1</span></div>
            <div class="flex gap-2">
                <a th:href="@{/admin/movies(page=${page.number - 1},size=${page.size},q=${q})}"
                   th:classappend="${page.first} ? 'opacity-40 pointer-events-none' : ''"
                   class="rounded-md border border-slate-300 px-3 py-1.5 bg-white hover:bg-slate-50">Prev</a>
                <a th:href="@{/admin/movies(page=${page.number + 1},size=${page.size},q=${q})}"
                   th:classappend="${page.last} ? 'opacity-40 pointer-events-none' : ''"
                   class="rounded-md border border-slate-300 px-3 py-1.5 bg-white hover:bg-slate-50">Next</a>
            </div>
        </div>
    </section>
</div>
</body>
</html>
