<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${resp != null ? 'Edit Schedule • Admin' : 'New Schedule • Admin'}">Schedule • Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
</head>
<body>
<div th:replace="~{admin/layout :: shell(~{::section})}">
    <section>
        <!-- breadcrumb + header -->
        <div class="flex items-start justify-between mb-6">
            <div>
                <nav class="text-sm text-slate-500 mb-1">
                    <a th:href="@{/admin}" class="hover:text-slate-700">Admin</a> /
                    <a th:href="@{/admin/schedules}" class="hover:text-slate-700">Schedules</a> /
                    <span class="text-slate-700" th:text="${resp != null ? 'Edit' : 'New'}">New</span>
                </nav>
                <h1 class="text-2xl font-semibold text-slate-900"
                    th:text="${resp != null ? 'Edit Schedule' : 'New Schedule'}">New Schedule</h1>
            </div>
            <a th:href="@{/admin/schedules}"
               class="inline-flex items-center rounded-md border border-slate-300 bg-white px-4 py-2.5 text-slate-700 hover:bg-slate-50">Back</a>
        </div>

        <!-- form -->
        <form th:action="${resp != null} ? @{|/admin/schedules/${resp.id}|} : @{/admin/schedules}"
              method="post"
              class="space-y-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Movie -->
                <label class="space-y-1">
                    <span class="block text-sm font-medium text-slate-700">Movie</span>
                    <select name="movieId" required
                            class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                        <option th:each="m : ${movies}" th:value="${m.id}" th:text="${m.title}"
                                th:selected="${resp != null and resp.movieId == m.id}"></option>
                    </select>
                </label>

                <!-- Screen -->
                <label class="space-y-1">
                    <span class="block text-sm font-medium text-slate-700">Screen</span>
                    <select name="screenId" required
                            class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                        <option th:each="s : ${screens}" th:value="${s.id}"
                                th:text="${s.name + ' (' + s.code + ')'}"
                                th:selected="${resp != null and resp.screenId == s.id}"></option>
                    </select>
                </label>

                <!-- Rate Card -->
                <label class="space-y-1">
                    <span class="block text-sm font-medium text-slate-700">Rate Card</span>
                    <select name="rateCardId" required
                            class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                        <option th:each="p : ${prices}" th:value="${p.id}" th:text="${p.name}"
                                th:selected="${resp != null and resp.rateCardId == p.id}"></option>
                    </select>
                </label>


                <!-- Session Start -->
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-slate-700" for="sessionStartTime">Session Start</label>

                    <input id="sessionStartTime"
                           type="datetime-local"
                           name="sessionStartTime"
                           required
                           class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                           th:value="${resp != null ? #temporals.format(resp.sessionStartTime,'yyyy-MM-dd''T''HH:mm') : ''}" />
                </div>

                <script>
                    // Disable past date/time in picker
                    (function () {
                        const pad = n => String(n).padStart(2, '0');
                        const input = document.getElementById('sessionStartTime');
                        if (!input) return;

                        // Build "now" in local time, formatted for datetime-local (yyyy-MM-ddTHH:mm)
                        function getLocalNow() {
                            const now = new Date();
                            return (
                                now.getFullYear() + '-' +
                                pad(now.getMonth() + 1) + '-' +
                                pad(now.getDate()) + 'T' +
                                pad(now.getHours()) + ':' +
                                pad(now.getMinutes())
                            );
                        }

                        // Initialize min value to the current minute
                        input.min = getLocalNow();

                        // Re-check on every input
                        input.addEventListener('input', () => {
                            if (input.value && input.value < input.min) {
                                input.setCustomValidity('Session start time cannot be in the past.');
                            } else {
                                input.setCustomValidity('');
                            }
                        });

                        // Update the min every 30 seconds so time stays accurate
                        setInterval(() => {
                            input.min = getLocalNow();
                        }, 30000);
                    })();
                </script>




                <!-- Status (edit only) -->
                <label class="space-y-1" th:if="${resp != null}">
                    <span class="block text-sm font-medium text-slate-700">Status</span>
                    <select name="status"
                            class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                        <option value="ACTIVE" th:selected="${resp.status == 'ACTIVE'}">ACTIVE</option>
                        <option value="CANCELLED" th:selected="${resp.status == 'CANCELLED'}">CANCELLED</option>
                    </select>
                </label>
            </div>

            <p class="text-sm text-slate-500">
                End time is calculated automatically from the selected movie’s duration.
            </p>

            <div class="flex gap-2">
                <button type="submit"
                        class="inline-flex items-center rounded-md bg-indigo-600 px-4 py-2.5 text-white hover:bg-indigo-700 shadow-sm">Save</button>
                <a th:href="@{/admin/schedules}"
                   class="inline-flex items-center rounded-md border border-slate-300 bg-white px-4 py-2.5 text-slate-700 hover:bg-slate-50">Cancel</a>
            </div>
        </form>
    </section>
</div>
</body>
</html>
