<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schedules • Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
</head>
<body>
<div th:replace="~{admin/layout :: shell(~{::section})}">
    <section>
        <!-- breadcrumb + header -->
        <div class="flex items-start justify-between mb-6">
            <div>
                <nav class="text-sm text-slate-500 mb-1">
                    <a th:href="@{/admin}" class="hover:text-slate-700">Admin</a> /
                    <span class="text-slate-700">Schedules</span>
                </nav>
                <h1 class="text-2xl font-semibold text-slate-900">Schedules</h1>
                <p class="text-sm text-slate-500">Manage showtimes linking movies, screens, and pricing.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <a th:href="@{/admin/schedules/new}"
                   class="inline-flex items-center rounded-md bg-indigo-600 px-4 py-2.5 text-white hover:bg-indigo-700 shadow-sm">
                    + New Schedule
                </a>
            </div>
        </div>

        <!-- search -->
        <form th:action="@{/admin/schedules}" method="get" class="mb-5">
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" name="q" th:value="${q}" placeholder="Search by movie, screen, or rate card…"
                       class="flex-1 rounded-md border border-slate-300 bg-white px-3 py-2.5 text-slate-900 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
                <div class="flex gap-2">
                    <button class="rounded-md border border-slate-300 bg-white px-4 py-2.5 text-slate-700 hover:bg-slate-50">
                        Search
                    </button>
                    <a th:href="@{/admin/schedules}"
                       class="rounded-md border border-slate-300 bg-white px-4 py-2.5 text-slate-700 hover:bg-slate-50">
                        Reset
                    </a>
                </div>
            </div>
        </form>

        <!-- table -->
        <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <colgroup>
                        <col />                      <!-- Movie (flex space) -->
                        <col style="width:18%" />    <!-- Screen -->
                        <col style="width:16%" />    <!-- Rate Card -->
                        <col style="width:120px" />  <!-- Start -->
                        <col style="width:120px" />  <!-- End -->
                        <col style="width:90px" />   <!-- Status -->
                        <col style="width:130px" />  <!-- Actions -->
                    </colgroup>

                    <thead class="bg-slate-50 sticky top-0 z-10">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Movie</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Screen</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Rate Card</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Start</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">End</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Status</th>
                        <th class="px-4 py-3 text-right text-xs font-semibold text-slate-600 uppercase">Actions</th>
                    </tr>
                    </thead>

                    <tbody class="divide-y divide-slate-100">
                    <tr th:each="it : ${page.content}" class="hover:bg-indigo-50/40 transition-colors even:bg-slate-50/40">
                        <!-- Movie -->
                        <td class="px-4 py-3 align-top">
                            <div class="font-semibold text-slate-900 whitespace-normal break-words leading-snug"
                                 th:text="${it.movieTitle}">Movie title</div>
                        </td>

                        <!-- Screen -->
                        <td class="px-4 py-3 align-top">
                            <div class="text-slate-900" th:text="${it.screenName}">Screen 1</div>
                            <div class="text-xs text-slate-500 truncate" th:text="${it.screenCode}">SC-001</div>
                        </td>

                        <!-- Rate Card -->
                        <td class="px-4 py-3 text-slate-700 truncate" th:text="${it.rateCardName}">Standard</td>

                        <!-- Start -->
                        <td class="px-4 py-3 text-slate-700 whitespace-nowrap"
                            th:text="${#temporals.format(it.sessionStartTime,'yyyy-MM-dd HH:mm')}">2025-01-01 18:00</td>

                        <!-- End -->
                        <td class="px-4 py-3 text-slate-700 whitespace-nowrap"
                            th:text="${#temporals.format(it.sessionEndTime,'yyyy-MM-dd HH:mm')}">2025-01-01 20:30</td>

                        <!-- Status -->
                        <td class="px-4 py-3">
                            <span th:if="${it.status == 'ACTIVE'}"
                                  class="inline-flex items-center rounded-full bg-green-50 px-2 py-0.5 text-xs font-medium text-green-700 border border-green-200">Active</span>
                            <span th:if="${it.status != 'ACTIVE'}"
                                  class="inline-flex items-center rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-600 border border-slate-200">Cancelled</span>
                        </td>

                        <!-- Actions -->
                        <td class="px-4 py-3">
                            <div class="flex justify-end gap-2">
                                <a th:href="@{|/admin/schedules/${it.id}/edit|}"
                                   class="inline-flex items-center rounded-md border border-slate-300 bg-white px-3 py-1.5 text-slate-700 hover:bg-slate-50">
                                    Edit
                                </a>
                                <form th:action="@{|/admin/schedules/${it.id}/delete|}" method="post"
                                      onsubmit="return confirm('Delete this schedule?');">
                                    <button type="submit"
                                            class="inline-flex items-center rounded-md bg-red-50 text-red-700 border border-red-200 px-3 py-1.5 hover:bg-red-100">
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <!-- Empty state -->
                    <tr th:if="${#lists.isEmpty(page.content)}">
                        <td colspan="7" class="px-4 py-10 text-center text-slate-500">
                            No schedules found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- pagination -->
        <div th:if="${page.totalPages > 1}"
             class="mt-6 flex items-center justify-between text-slate-600 text-sm">
            <div>
                Page <span th:text="${page.number + 1}">1</span> of
                <span th:text="${page.totalPages}">1</span>
            </div>
            <div class="flex gap-2">
                <a th:href="@{/admin/schedules(page=${page.number - 1},size=${page.size},q=${q})}"
                   th:classappend="${page.first} ? 'opacity-40 pointer-events-none' : ''"
                   class="rounded-md border border-slate-300 px-3 py-1.5 bg-white hover:bg-slate-50">Prev</a>
                <a th:href="@{/admin/schedules(page=${page.number + 1},size=${page.size},q=${q})}"
                   th:classappend="${page.last} ? 'opacity-40 pointer-events-none' : ''"
                   class="rounded-md border border-slate-300 px-3 py-1.5 bg-white hover:bg-slate-50">Next</a>
            </div>
        </div>
    </section>
</div>
</body>
</html>
