<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body>
<div th:replace="~{admin/layout :: shell(~{::section})}">
    <section>
        <h1 class="text-3xl font-bold mb-6 text-slate-900">Dashboard</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow">
                <div class="text-sm text-slate-600 font-medium">Active Movies</div>
                <div class="text-3xl font-semibold text-slate-900 mt-2" th:text="${activeMovies}">0</div>
                <div class="text-xs text-slate-500 mt-1">Currently showing</div>
            </div>
<!--            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow">-->
<!--                <div class="text-sm text-slate-600 font-medium">Total Users</div>-->
<!--                <div class="text-3xl font-semibold text-slate-900 mt-2" th:text="${totalUsers}">0</div>-->
<!--                <div class="text-xs text-slate-500 mt-1">Registered customers</div>-->
<!--            </div>-->
            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow">
                <div class="text-sm text-slate-600 font-medium">Schedules</div>
                <div class="text-3xl font-semibold text-slate-900 mt-2" th:text="${schedules}">0</div>
                <div class="text-xs text-slate-500 mt-1">Upcoming shows</div>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow">
                <div class="text-sm text-slate-600 font-medium">Total Revenue</div>
                <div class="text-3xl font-semibold text-slate-900 mt-2">
                    $<span th:text="${#numbers.formatDecimal(totalRevenue,1,'COMMA',2,'POINT')}">0.00</span>
                </div>
                <div class="text-xs text-slate-500 mt-1">All time earnings</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                <h3 class="text-lg font-semibold text-slate-900 mb-4">Recent Activity</h3>
                <div class="space-y-3">
                    <div class="flex items-center justify-between py-2 border-b border-slate-100">
                        <span class="text-sm text-slate-600">Dashboard loaded</span>
                        <span class="text-xs text-slate-500">Just now</span>
                    </div>
                    <div class="flex items-center justify-between py-2 border-b border-slate-100">
                        <span class="text-sm text-slate-600" th:text="'Active movies: ' + ${activeMovies}">Active movies: 0</span>
                        <span class="text-xs text-slate-500">Live data</span>
                    </div>
                    <div class="flex items-center justify-between py-2">
                        <span class="text-sm text-slate-600" th:text="'Total revenue: $' + ${#numbers.formatDecimal(totalRevenue,1,'COMMA',2,'POINT')}">Total revenue: $0.00</span>
                        <span class="text-xs text-slate-500">Live data</span>
                    </div>
                </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                <h3 class="text-lg font-semibold text-slate-900 mb-4">Quick Actions</h3>
                <div class="space-y-3">
                    <a href="/admin/movies" class="block w-full text-left px-4 py-3 bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100 transition-colors border border-blue-200">
                        📽️ Manage Movies
                    </a>
                    <a href="/admin/schedules" class="block w-full text-left px-4 py-3 bg-green-50 text-green-700 rounded-lg hover:bg-green-100 transition-colors border border-green-200">
                        🕒 Create Schedule
                    </a>
                    <a href="/admin/reports/revenue" class="block w-full text-left px-4 py-3 bg-purple-50 text-purple-700 rounded-lg hover:bg-purple-100 transition-colors border border-purple-200">
                        📊 View Reports
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
