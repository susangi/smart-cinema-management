<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Smart Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-slate-100">

<div class="w-full max-w-md bg-white border border-slate-200 shadow-lg rounded-2xl p-8 text-slate-800">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-slate-900 mb-2">Smart Cinema</h1>
        <p class="text-slate-600">Admin Panel Login</p>
    </div>

    <div th:if="${msg}"
         class="bg-blue-50 border border-blue-200 text-blue-700 px-4 py-2 rounded-lg mb-4 text-sm"
         th:text="${msg}"></div>

    <form th:action="@{/perform_login}" method="post" class="space-y-6">
        <div>
            <label for="username" class="block text-sm font-medium mb-1 text-slate-700">Username</label>
            <input type="text" name="username" id="username"
                   class="block w-full px-4 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-slate-900 placeholder-slate-400"
                   placeholder="Enter username" required>
        </div>

        <div>
            <label for="password" class="block text-sm font-medium mb-1 text-slate-700">Password</label>
            <input type="password" name="password" id="password"
                   class="block w-full px-4 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-slate-900 placeholder-slate-400"
                   placeholder="Enter password" required>
        </div>

        <div>
            <button type="submit"
                    class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200 shadow-sm hover:shadow-md">
                Sign In
            </button>
        </div>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
        &copy; 2025 Smart Cinema. All rights reserved.
    </p>
</div>

</body>

</html>
